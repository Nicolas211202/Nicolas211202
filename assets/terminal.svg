<svg width="880" height="300" viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secuencia de inicio: robótica, inteligencia artificial y automatización.">
  <title>Nicolás Sánchez: robótica e IA</title>
  <style>
    .mono { font-family: 'Courier New', 'SFMono-Regular', Consolas, Menlo, monospace; }
    .eye { animation: blinkeye 4.2s infinite; }
    @keyframes blinkeye { 0%, 90%, 100% { opacity: 1; } 93%, 96% { opacity: 0.05; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .wave { transform-box: fill-box; transform-origin: 50% 100%; animation: wave 1.15s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
    .scan { animation: scan 7s linear infinite; }
    @keyframes scan { from { transform: translateY(0px); } to { transform: translateY(238px); } }
  </style>

  <!-- terminal window -->
  <rect x="16" y="16" width="848" height="268" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- dot grid (generative backdrop) -->
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#243e54"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="22 22" dur="8s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="scanglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60c5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60c5ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60c5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="36" y="228" width="0" height="22">
        <animate attributeName="width" from="0" to="405" begin="2.8s" dur="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="win"><rect x="16" y="16" width="848" height="268" rx="10"/></clipPath>
  </defs>
  <rect x="17" y="53" width="846" height="230" fill="url(#grid)" opacity="0.6"/>

  <!-- moving scanline -->
  <g clip-path="url(#win)">
    <rect class="scan" x="17" y="40" width="846" height="6" fill="url(#scanglow)" opacity="0.6"/>
  </g>

  <!-- Windows-inspired title bar -->
  <path d="M26 17H854Q863 17 863 26V52H17V26Q17 17 26 17" fill="#182332"/>
  <path d="M32 29L38 34L32 39M42 40H49" fill="none" stroke="#60c5ff" stroke-width="1.8"/>
  <text x="61" y="39" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#d5e4f2">Nicolás Sánchez — Laboratorio de ideas</text>
  <path d="M726 34H737" stroke="#c9d1d9"/>
  <rect x="778" y="29" width="10" height="10" fill="none" stroke="#c9d1d9"/>
  <path d="M829 29L839 39M839 29L829 39" stroke="#c9d1d9"/>
  <line x1="17" y1="52" x2="863" y2="52" stroke="#334960"/>

  <!-- boot log -->
  <text class="mono" opacity="0" x="36" y="86" font-size="14" fill="#c9d1d9"><tspan fill="#60c5ff">PS &gt;</tspan> .\iniciar_nicolas.ps1<set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/></text>
  <text class="mono" opacity="0" x="36" y="112" font-size="14" fill="#c9d1d9"><tspan fill="#3fb950">[ OK ]</tspan> robótica ........ <tspan fill="#58a6ff">ESP32 · Arduino · ROS</tspan><set attributeName="opacity" to="1" begin="0.8s" fill="freeze"/></text>
  <text class="mono" opacity="0" x="36" y="138" font-size="14" fill="#c9d1d9"><tspan fill="#3fb950">[ OK ]</tspan> IA y visión ..... <tspan fill="#58a6ff">Python · OpenCV · MediaPipe</tspan><set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/></text>
  <text class="mono" opacity="0" x="36" y="164" font-size="14" fill="#c9d1d9"><tspan fill="#3fb950">[ OK ]</tspan> software ........ <tspan fill="#58a6ff">FastAPI · SQL · C/C++</tspan><set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/></text>
  <text class="mono" opacity="0" x="36" y="190" font-size="14" fill="#c9d1d9"><tspan fill="#3fb950">[ OK ]</tspan> automatización .. <tspan fill="#58a6ff">n8n · APIs · Power Automate</tspan><set attributeName="opacity" to="1" begin="2.0s" fill="freeze"/></text>
  <text class="mono" opacity="0" x="36" y="216" font-size="14" fill="#c9d1d9"><tspan fill="#d29922">[ &gt;&gt; ]</tspan> misión .......... <tspan fill="#e6edf3" font-weight="bold">DAR_VIDA_A_LAS_IDEAS</tspan><set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/></text>

  <!-- typed status line -->
  <g clip-path="url(#typeclip)">
    <text class="mono" x="36" y="245" font-size="14" fill="#3fb950">&gt; estado: creando con robótica e IA</text>
  </g>
  <rect opacity="0" x="446" y="232" width="9" height="16" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" begin="4.1s" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- right column: name -->
  <text class="mono" opacity="0" x="724" y="96" font-size="22" font-weight="bold" fill="#e6edf3" text-anchor="middle">NICOLÁS SÁNCHEZ<set attributeName="opacity" to="1" begin="0.2s" fill="freeze"/></text>
  <text class="mono" opacity="0" x="724" y="118" font-size="10.5" letter-spacing="1.5" fill="#3fb950" text-anchor="middle">INGENIERO MECATRÓNICO<set attributeName="opacity" to="1" begin="0.2s" fill="freeze"/></text>

  <!-- Personal robot: articulated body and orbiting signal -->
  <g transform="translate(724 195)">
    <ellipse rx="91" ry="60" fill="none" stroke="#23445b" stroke-dasharray="4 8"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle cx="91" cy="0" r="4" fill="#60c5ff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
      <path d="M0 -49V-38" stroke="#60c5ff" stroke-width="2"/>
      <circle class="pulse" cy="-52" r="4" fill="#60c5ff"/>
      <path d="M-38 -30L-29 -39H29L38 -30V7L28 17H-28L-38 7Z" fill="#172c40" stroke="#60c5ff" stroke-width="2"/>
      <rect x="-29" y="-27" width="58" height="27" rx="9" fill="#09131e"/>
      <path class="eye" d="M-21 -13L-14 -17L-7 -13M7 -13L14 -17L21 -13" fill="none" stroke="#65e6b4" stroke-width="3" stroke-linecap="round"/>
      <path d="M-7 7H7" stroke="#65e6b4" stroke-width="2"/>
      <path d="M-22 23H22L27 48H-27Z" fill="#172c40" stroke="#60c5ff" stroke-width="2"/>
      <circle cy="35" r="5" fill="#65e6b4" class="pulse"/>
      <path d="M-29 27L-44 15L-51 0M29 27L44 15L51 0" fill="none" stroke="#60c5ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-44" cy="15" r="4" fill="#65e6b4"/><circle cx="44" cy="15" r="4" fill="#65e6b4"/>
      <path d="M-14 49V59H-24M14 49V59H24" fill="none" stroke="#60c5ff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
